name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk NeathFX.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeathFX-apk
          path: NeathFX.apk

      - name: Publish release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Neath FX build ${{ github.run_number }}
          body: "Built from ${{ github.sha }}. Download NeathFX.apk on your phone and open it to install."
          files: NeathFX.apk
          make_latest: true
